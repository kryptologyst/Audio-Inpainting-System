name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.10, 3.11, 3.12]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Lint with ruff
      run: |
        pip install ruff
        ruff check src/ tests/ demo/ --output-format=github
    
    - name: Format check with black
      run: |
        pip install black
        black --check src/ tests/ demo/
    
    - name: Run tests
      run: |
        pip install pytest
        pytest tests/ -v --cov=src --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  demo-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: 3.10
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Test system functionality
      run: |
        python test_system.py
    
    - name: Create synthetic dataset
      run: |
        python -c "from src.data import create_synthetic_dataset; create_synthetic_dataset('data/wav', num_samples=10, sample_rate=16000, duration=1.0)"
    
    - name: Test model inference
      run: |
        python -c "
        import torch
        from src.models import create_model
        from src.utils import get_device
        
        device = get_device('cpu')
        model = create_model('unet1d', in_channels=1, out_channels=1)
        model = model.to(device)
        
        # Test inference
        x = torch.randn(1, 1, 1000)
        with torch.no_grad():
            output = model(x)
        
        print(f'Input shape: {x.shape}, Output shape: {output.shape}')
        assert output.shape == x.shape, 'Output shape mismatch'
        print('Model inference test passed!')
        "

  build:
    runs-on: ubuntu-latest
    needs: [test, demo-test]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: 3.10
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: |
        python -m build
    
    - name: Check package
      run: |
        twine check dist/*
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: dist
        path: dist/
